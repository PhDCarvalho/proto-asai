<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="img/icon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Magra:wght@400;700&display=swap" rel="stylesheet">
    <title>Carregando...</title>
</head>
<body style="align-content: center; justify-content: center;">

    <div class="loading">
        <div class="load1">
            <div class="load1 l2"></div>
            <div class="load1 l3"></div>
        </div>
    </div>
    
    <script src="popup.js" type="module"></script>
    <script>
        var url = new URL(window.location.href)
        var sec = Number(url.searchParams.get('time')) * 1000
        if (sec == null || sec < 10) sec = 0
        setTimeout(() => {
            window.location.href = url.searchParams.get('to') + '.html';
        }, Math.random() * 150 + sec);
        // }, 1);
    </script>
</body>
</html>
