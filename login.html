<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="img/icon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Magra:wght@400;700&display=swap" rel="stylesheet">
    <title>Entrar</title>
</head>
<body style="align-content: center;">


    <div class="access info">
        <span>
            ⓘ Realize login para utilizar o app.
        </span>
    </div>


    <!-- <div class="container nohover" style="height: 80vh;"> -->
    <div class="container nohover">
        <h2 class="title">Entrar</h2>

        <label for="username">Nome de Usuário <span style="color: red">*</span></label>
        <input type="email" name="Nome de Usuário" placeholder="Seu nome de usuário" id="username"> 

        <label for="password">Senha <span style="color: red">*</span></label>
        <input type="password" name="Senha" placeholder="Sua senha" id="password"> 
        <!-- <a href="forget.html"> -->
        <a href="loading.html?to=add">
            Esqueci minha senha...</a>

        <button class="access" id="log">Entrar</button>
    </div>
    

    <script src="popup.js" type="module"></script>
    <script src="login.js" type="module"></script>
</body>
</html>
